name: MeloTR Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: melotr-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use latest checked-in application sources
        run: |
          test -s lib/main.dart
          test -s lib/mp3_import_service.dart
          test -s lib/mp3_import_tools.dart
          test -s lib/youtube_music_service.dart
          test -s lib/audio_stream_diagnostics.dart
          test -s lib/signed_audio_transfer.dart
          test -s test/signed_audio_transfer_test.dart
          test -s test/audio_stream_diagnostics_test.dart
          test -s lib/newpipe_audio_service.dart
          test -s test/newpipe_audio_service_test.dart
          test -s lib/audio_data_profile.dart
          test -s test/audio_data_profile_test.dart
          test -s lib/youtube_music_page.dart
          test -s lib/download_control.dart
          test -s test/download_control_test.dart
          test -f assets/icons/placeholder.png
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android project
        run: flutter create --platforms=android --org com.melotr --project-name melotr .
      - name: Set up media playback and Android permissions
        run: python3 tools/configure_android.py
      - name: Fetch dependencies
        run: flutter pub get
      - name: Align legacy MediaStore plugin with current Android SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          candidates = list((Path.home()/'.pub-cache'/'hosted').glob('*/media_store_plus-*/android/build.gradle'))
          if len(candidates) != 1:
              raise SystemExit(f'Expected exactly one MediaStore Gradle file, got: {candidates}')
          path = candidates[0]
          source = path.read_text(encoding='utf-8')
          old = 'compileSdkVersion 33'
          if old not in source:
              raise SystemExit(f'Unexpected media_store_plus Gradle settings: {path}')
          path.write_text(source.replace(old, 'compileSdkVersion 36', 1), encoding='utf-8')
          print(f'Updated Android compileSdk 33 -> 36 in {path}')
          PY
      - name: Check new import sources
        run: |
          dart format --output=none --set-exit-if-changed lib/mp3_import_service.dart lib/mp3_import_tools.dart lib/youtube_music_service.dart lib/youtube_music_page.dart lib/download_control.dart lib/audio_stream_diagnostics.dart lib/signed_audio_transfer.dart lib/newpipe_audio_service.dart || true
          flutter analyze --no-fatal-infos
      - name: Test Flutter code
        run: flutter test
      - name: Build universal APK
        run: flutter build apk --release
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$apk"
          ls -lh "$apk"
          if gh release view v0.2.0 >/dev/null 2>&1; then
            gh release upload v0.2.0 "$apk#MeloTR-v0.2.0.apk" --clobber
          else
            gh release create v0.2.0 "$apk#MeloTR-v0.2.0.apk" \
              --target "$GITHUB_SHA" \
              --title "MeloTR v0.2.0" \
              --notes "Android universal release APK. Telefonunuza indirip yükleyebilirsiniz."
          fi

name: MeloTR Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: melotr-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use latest checked-in application sources
        run: |
          test -s lib/main.dart
          test -s lib/mp3_import_service.dart
          test -s lib/mp3_import_tools.dart
          test -f assets/icons/placeholder.png
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android project
        run: flutter create --platforms=android --org com.melotr --project-name melotr .
      - name: Set up media playback and Android permissions
        run: python3 tools/configure_android.py
      - name: Fetch dependencies
        run: flutter pub get
      - name: Check new import sources
        run: |
          dart format --output=none --set-exit-if-changed lib/mp3_import_service.dart lib/mp3_import_tools.dart || true
          flutter analyze --no-fatal-infos
      - name: Test Flutter code
        run: flutter test
      - name: Build universal APK
        run: flutter build apk --release
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$apk"
          ls -lh "$apk"
          if gh release view v0.1.2 >/dev/null 2>&1; then
            gh release upload v0.1.2 "$apk#MeloTR-v0.1.2.apk" --clobber
          else
            gh release create v0.1.2 "$apk#MeloTR-v0.1.2.apk" \
              --target "$GITHUB_SHA" \
              --title "MeloTR v0.1.2" \
              --notes "Android universal release APK. Telefonunuza indirip yükleyebilirsiniz."
          fi

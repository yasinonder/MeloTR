name: melotr
description: MeloTR - cihazındaki müzikler için modern, çevrimdışı Android müzik çalar.
publish_to: none
version: 0.2.0+12

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  on_audio_query_pluse: ^3.0.7
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  audio_service: ^0.18.18
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  dio: ^5.9.0
  path_provider: ^2.1.5
  file_picker: ^10.3.10
  ffmpeg_kit_flutter_new_audio: ^2.5.7
  media_store_plus: ^0.1.3
  youtube_explode_dart: ^3.1.0
  newpipeextractor_dart:
    git:
      url: https://github.com/SongTube/NewPipeExtractor_Dart.git
      ref: a9260dff4a9ed1429660e0eac5995f952230c98e

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
